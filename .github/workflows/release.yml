#
# Module: Semantic release validation workflow
# Purpose: Validate that a release tag matches package.json and the full production checks pass.
# Used by: GitHub Actions on version tags matching vMAJOR.MINOR.
# Dependencies: Node.js, npm lockfile, package.json, and repository environment configuration for build.
# Public functions: None; workflow jobs only.
# Side effects: Consumes CI minutes and creates no deployment or external resource.
#
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+'

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run version:check
      - name: Verify tag matches package version
        shell: bash
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")"
      - run: npm run lint
      - run: npm test
      - run: npx tsc --noEmit
      - run: npx next build --webpack
